[project]
name = "agentkit"
version = "0.1.0"
description = "Shared runtime kit for Strands agents on Bedrock AgentCore"
requires-python = ">=3.13"
dependencies = [
  "strands-agents>=1.59,<2",
  "bedrock-agentcore>=1.24,<2",
  "boto3>=1.43.110",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentkit"]
