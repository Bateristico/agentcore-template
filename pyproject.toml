[project]
name = "agentcore-strands-template"
version = "0.1.0"
description = "Deploy Strands agents to Bedrock AgentCore and compare models on cost and quality"
requires-python = ">=3.13"
dependencies = [
  "agentkit",
  "boto3>=1.43.110",
  "pydantic>=2.9",
  "pyyaml>=6.0.2",
  "jinja2>=3.1",
  "streamlit>=1.65",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
invoke = "template_core.cli_invoke:main"

[tool.uv.workspace]
members = ["agents/_kit"]

[tool.uv.sources]
agentkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["template_core", "bench", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["aws: needs real AWS credentials (skipped unless --run-aws)"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["infra"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["E501"]
