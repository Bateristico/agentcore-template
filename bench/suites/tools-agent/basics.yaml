suite: basics
estimate: { input_tokens: 6000, output_tokens: 400 }
cases:
  - id: threshold
    prompt: "What is 17% of 2,340 and is that above the 400 threshold?"
    expected: "397.8, which is below 400"
    rubric: "Correct number; correct comparison; uses the calculator tool."
  - id: status
    prompt: "What is the status of order A101 and when will it arrive?"
    expected: "Processing; about 5 days"
    rubric: "Uses lookup_order; states processing and about 5 days; no invented details."
  - id: total
    prompt: "What is the combined total of orders A100 and A102 in DKK?"
    expected: "438 DKK"
    rubric: "Looks up both orders and computes 349 + 89 = 438 DKK."
